<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>XWorld Pro v2.3.6</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1628; font-family: Arial, sans-serif; touch-action: manipulation; overscroll-behavior: none; }
        .phone { width: 100%; height: 100vh; height: 100dvh; background: #0a1628; position: relative; overflow: hidden; }
        .screen { width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow-y: auto; display: none; }
        .screen.active { display: block !important; }

        #loginScreen { background: #0b1a30; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; min-height: 100%; }
        .logo { font-size: 36px; font-weight: bold; color: #00d4ff; }
        .input { width: 85%; padding: 12px; border-radius: 12px; border: 2px solid rgba(0,212,255,0.3); background: rgba(255,255,255,0.05); color: white; font-size: 14px; margin-bottom: 10px; text-align: center; outline: none; }
        .btn { padding: 12px 20px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; color: white; }
        .btn-login { width: 85%; background: #00d4ff; color: black; }
        .link { color: #00d4ff; font-size: 12px; cursor: pointer; margin-top: 5px; }
        .user-list { width: 85%; max-height: 100px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; margin-bottom: 8px; display: none; }
        .user-item { padding: 10px; color: white; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; }

        #homeScreen { background: #0a1628; padding-bottom: 60px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: #0d1f35; }
        .balances { display: flex; gap: 8px; align-items: center; color: white; font-size: 11px; }
        .bal-icon { width: 16px; height: 16px; }
        .pet-frame { width: 260px; margin: 10px auto; text-align: center; background: #0d1f35; border-radius: 20px; border: 2px solid #00d4ff; padding: 15px; cursor: pointer; }
        .pet-image { font-size: 70px; }
        .pet-exp-bar { width: 100%; height: 6px; background: #222; border-radius: 3px; margin: 5px 0; overflow: hidden; }
        .pet-exp-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #00ff88); }
        .section-title { padding: 5px 15px; color: white; font-weight: bold; font-size: 13px; }
        .game-scroll { display: flex; gap: 8px; padding: 0 15px; overflow-x: auto; }
        .game-card { min-width: 80px; background: #0d1f35; border-radius: 10px; padding: 8px; text-align: center; color: white; font-size: 10px; }
        .navbar { position: fixed; left: 0; right: 0; bottom: 0; height: 55px; background: #0d1f35; display: flex; z-index: 999; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; font-size: 10px; cursor: pointer; }

        .card { background: #0d1f35; border-radius: 15px; padding: 20px; margin: 10px 0; text-align: center; }
        .back-btn { color: white; font-size: 22px; cursor: pointer; background: none; border: none; padding: 5px; }
        .menu-item { width: 100%; min-height: 55px; padding: 0 20px; background: #171c23; border-radius: 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; color: #f2f2f2; font-size: 15px; cursor: pointer; }
        .menu-item.admin { background: #241011; border: 1px solid #ff3b3b; }
        .qty-btn { width: 35px; height: 35px; border-radius: 8px; background: #0d1f35; color: white; font-size: 18px; border: none; cursor: pointer; }
        .admin-table { width: 100%; border-collapse: collapse; color: white; font-size: 11px; }
        .admin-table th, .admin-table td { padding: 6px; border: 1px solid #333; }
        .admin-table th { background: #222; }
        .lb-table { width: 100%; border-collapse: collapse; color: white; font-size: 12px; }
        .lb-table th, .lb-table td { padding: 8px; border: 1px solid #333; }
        .alert-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a2e; border: 2px solid #ffd700; border-radius: 20px; padding: 25px; text-align: center; z-index: 999; display: none; min-width: 280px; color: white; }
        .alert-icon { font-size: 50px; }
        .alert-title { color: #ffd700; font-size: 20px; font-weight: bold; margin: 10px 0; }
        .alert-text { color: #ddd; font-size: 14px; }
        .ban-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; }
